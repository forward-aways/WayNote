# 途笺 WayNote · Nginx 站点（按实测环境写好，直接复制即可）
#
# 安装（新机器）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/waynote.conf
#   sudo ln -sf /etc/nginx/sites-available/waynote.conf /etc/nginx/sites-enabled/waynote.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 当前线上形态（2026-10-12）：
#   A) https://waynote.cn / https://www.waynote.cn —— 正式域名（备案：辽ICP备2026015937号-2）
#      80 → 301 → 443（Let's Encrypt；certbot.timer 自动续期）。
#      续期/扩展域名：sudo certbot --nginx -d waynote.cn -d www.waynote.cn --redirect
#   B) 8090 —— 备案前的入口 / 应急兜底（保留，与域名并存；仍是明文 http）
#
# 附带：图片媒体（/media/）与上传体积上限（6m）在两个 server 块内都有；
#      备份/恢复见 deploy/waynote-backup.sh 与 DEPLOY.md「备份与恢复」。
#
# 三个关键点：
# 1) 同机 nginx 已有站点占用 80/443/8080（meikenai.cn）；本文件按 server_name 精确匹配，不触碰其它站点。
#    域名未解析时也可用 Host 头探针验证本块：
#      curl -s -H "Host: waynote.cn" http://<服务器IP>/ -o /dev/null -w "%{http_code}\n"
# 2) 静态文件在家目录下，必须让 nginx 能"进入"家目录：
#      sudo chmod o+x /home/ubuntu
#    否则 error.log 会出现 `stat() ... Permission denied` + `rewrite or internal redirection cycle`，页面表现为 500。
# 3) 后端只监听 127.0.0.1:8010，/api/ 走反代；X-Forwarded-For 由应用按 TRUSTED_PROXY_IPS 白名单采信。
#
# 注：A 块的 443 指令与文件末尾的 80 跳转块由 certbot 写入（"# managed by Certbot"）；
#     手工改动后必须 `sudo nginx -t` 通过再 reload；certbot 续期时会自行维护这些行。

# ── A) 正式域名 waynote.cn（443 服务；80 跳转见文件末尾）──────────────
server {
    server_name waynote.cn www.waynote.cn;

    root /home/ubuntu/ai-project/WayNote/frontend/dist;
    index index.html;

    # 前端 SPA（vue-router history 模式）：找不到文件一律回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：反代到本机 uvicorn（后端只监听 127.0.0.1，不对外暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用仅在直连对端属于 TRUSTED_PROXY_IPS 白名单时采信此头
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 媒体文件（图片上传）：nginx 直供不走应用；uuid 键名不可枚举（ADR-20261012 图片篇 §4.6）
    # 注意：alias 指向 MEDIA_ROOT（.env 里的 media_root），换目录时两处同步改
    location /media/ {
        alias /home/ubuntu/waynote-media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 6m;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/waynote.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/waynote.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── B) 8090（备案前入口 / 应急兜底，保留）────────────────────────────
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /home/ubuntu/ai-project/WayNote/frontend/dist;
    index index.html;

    # 前端 SPA（vue-router history 模式）：找不到文件一律回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：反代到本机 uvicorn（后端只监听 127.0.0.1，不对外暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用仅在直连对端属于 TRUSTED_PROXY_IPS 白名单时采信此头
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 媒体文件（图片上传）：nginx 直供不走应用；uuid 键名不可枚举（ADR-20261012 图片篇 §4.6）
    # 注意：alias 指向 MEDIA_ROOT（.env 里的 media_root），换目录时两处同步改
    location /media/ {
        alias /home/ubuntu/waynote-media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 6m;
}

# ── C) HTTP → HTTPS 跳转（certbot 管理，勿手改）──────────────────────
server {
    if ($host = www.waynote.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = waynote.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name waynote.cn www.waynote.cn;
    return 404; # managed by Certbot
}
