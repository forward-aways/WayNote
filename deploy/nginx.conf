# 途笺 WayNote · Nginx 站点配置
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/waynote
#   sudo nano /etc/nginx/sites-available/waynote     # 改 server_name
#   sudo ln -sf /etc/nginx/sites-available/waynote /etc/nginx/sites-enabled/waynote
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    # ↓ 改成你的域名；ICP 备案未通过前 80/443 不可用，可先改成 listen 8080; 验证
    server_name waynote.example.com;

    root /srv/waynote/frontend/dist;
    index index.html;

    # 前端 SPA（vue-router history 模式）：找不到文件一律回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：反代到本机 uvicorn（后端只监听 127.0.0.1，不对外暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用按 TRUSTED_PROXY_IPS=127.0.0.1 才采信这个头，切勿直连暴露后端
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
