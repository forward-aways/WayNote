# 途笺 WayNote · Nginx 站点（按实测环境写好，直接复制即可）
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-enabled/waynote.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 两个关键点：
# 1) 端口 8090 —— 同机 nginx 已有站点占用 8080；换机器时先 `ss -ltnp` 看端口；
# 2) 静态文件在家目录下，必须让 nginx 能"进入"家目录：
#      sudo chmod o+x /home/ubuntu
#    否则 error.log 会出现 `stat() ... Permission denied` + `rewrite or internal redirection cycle`，页面表现为 500。
#    （把 dist 放 /var/www/waynote 可免去这一步，把下面的 root 指过去即可）
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /home/ubuntu/ai-project/WayNote/frontend/dist;
    index index.html;

    # 前端 SPA（vue-router history 模式）：找不到文件一律回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：反代到本机 uvicorn（后端只监听 127.0.0.1，不对外暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用仅在直连对端属于 TRUSTED_PROXY_IPS 白名单时采信此头
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
